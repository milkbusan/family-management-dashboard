const KEY='mythDressV2';let state={done:[],equipped:{},selected:0,page:'home',question:null};try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.done))state={...state,...saved,page:'home',question:null}}catch(e){}
const el=document.getElementById('view');const pic=i=>'assets/hero-'+i+'.png';const count=i=>state.done.filter(n=>qs[n][0]===i).length;const unlocked=(i,k)=>count(i)>=[3,6,10,15][k];function save(){localStorage.setItem(KEY,JSON.stringify(state))}function setPage(p){state.page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('current',b.dataset.page===p));render();window.scrollTo(0,0)}function render(){document.getElementById('stars').textContent='⭐ '+state.done.length;if(state.page==='home')home();else if(state.page==='quiz')quiz();else dress()}
function home(){el.innerHTML=`<section class="panel"><h2 class="title">신화 퀴즈 × 옷입히기</h2><p class="sub">75문제를 풀고 다섯 신의 의상을 모아봐!</p><div class="heroRow"><img src="${pic(4)}" alt="아프로디테"><img src="${pic(2)}" alt="아테나"><img src="${pic(3)}" alt="아폴론"></div><button class="primary" id="play">모험 시작하기 ›</button></section><section class="panel"><b>나의 탐험 기록 ${state.done.length} / ${qs.length}</b><div class="progress"><i style="width:${state.done.length/qs.length*100}%"></i></div><p class="story">하나의 지역에 15문제씩 있어요. 3·6·10·15문제를 맞힐 때마다 새 의상이 열려요.</p></section>`;document.getElementById('play').onclick=()=>setPage('quiz')}
function quiz(){let i=state.selected;let available=qs.map((q,n)=>q[0]===i&&!state.done.includes(n)?n:-1).filter(n=>n>=0);if(state.question===null||qs[state.question]?.[0]!==i||state.done.includes(state.question))state.question=available[0]??null;let n=state.question;el.innerHTML=`<div class="tabs">${chars.map((c,j)=>`<button data-char="${j}" class="${i===j?'selected':''}">${c.name}</button>`).join('')}</div><section class="panel"><div class="quizHead"><img src="${pic(i)}" alt="${chars[i].name}"><div><b>${chars[i].name}</b><small>${chars[i].role} · ${count(i)}/15 완료</small></div></div><div class="progress"><i style="width:${count(i)/15*100}%"></i></div>${n===null?`<p class="celebrate">🎉 이 지역을 모두 탐험했어요!</p><p class="sub">다른 신을 골라 퀴즈를 이어가세요.</p><button class="primary" id="goDress">옷입히기 보기</button>`:`<div class="question">${qs[n][1]}</div><div class="answers">${qs[n][2].map((a,k)=>`<button class="answer" data-answer="${k}">${k+1}. ${a}</button>`).join('')}</div><div class="feedback" aria-live="polite">생각한 답을 눌러 보세요.</div><button class="primary hidden" id="next">다음 문제 ›</button>`}</section>`;el.querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>{state.selected=+b.dataset.char;state.question=null;save();render()});if(n===null){document.getElementById('goDress').onclick=()=>setPage('dress');return}el.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{let a=+b.dataset.answer;let correct=qs[n][3];if(a===correct){let before=count(i);state.done.push(n);save();el.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);b.classList.add('correct');let gained=[3,6,10,15].indexOf(before+1);el.querySelector('.feedback').innerHTML=gained>=0?`<strong>🎁 정답! ${chars[i].items[gained][1]} 획득!</strong>옷입히기에서 바로 착용할 수 있어요.`:`<strong>⭐ 정답이에요!</strong>${chars[i].story}`;document.getElementById('next').classList.remove('hidden');document.getElementById('stars').textContent='⭐ '+state.done.length}else{b.disabled=true;b.classList.add('incorrect');el.querySelector('.feedback').innerHTML=`<strong>한 번 더 생각해 봐요!</strong>틀려도 별은 사라지지 않아요.`}});document.getElementById('next').onclick=()=>{state.question=null;render()}}
function dress(){let i=state.selected;let c=chars[i];let worn=state.equipped[i]||[];el.innerHTML=`<section class="panel"><h2 class="title">나만의 신화 캐릭터</h2><p class="sub">모은 아이템을 눌러 입히거나 벗겨 보세요</p><div class="tabs">${chars.map((x,j)=>`<button data-char="${j}" class="${i===j?'selected':''}">${x.name}</button>`).join('')}</div><div class="outfitStage"><img src="${pic(i)}" alt="${c.name} 옷입히기 캐릭터">${c.items.map((item,k)=>worn.includes(k)&&unlocked(i,k)?`<span class="wear ${item[2]}" aria-label="${item[1]}">${item[0]}</span>`:'').join('')}</div><p class="story"><b>${c.name}</b> · ${c.story}</p><div class="progress"><i style="width:${count(i)/15*100}%"></i></div><p class="sub">${count(i)}/15 문제 완료 · ${c.items.filter((_,k)=>unlocked(i,k)).length}/4 의상 획득</p><div class="items">${c.items.map((item,k)=>`<button class="item ${worn.includes(k)?'worn':''}" data-item="${k}" ${unlocked(i,k)?'':'disabled'} aria-label="${item[1]} ${unlocked(i,k)?worn.includes(k)?'벗기':'입히기':'잠김'}"><span>${item[0]}</span><small>${item[1]}<br>${unlocked(i,k)?worn.includes(k)?'착용 중':'입히기':`${[3,6,10,15][k]}문제에 열림`}</small></button>`).join('')}</div></section><p class="notice">🎁 퀴즈에서 정답을 맞힐수록 의상이 열립니다. 캐릭터별로 의상을 바꿔 볼 수 있어요.</p>`;el.querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>{state.selected=+b.dataset.char;save();render()});el.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{let k=+b.dataset.item;let list=state.equipped[i]||[];state.equipped[i]=list.includes(k)?list.filter(x=>x!==k):[...list,k];save();render()})}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));document.getElementById('reset').onclick=()=>{if(confirm('퀴즈 기록과 의상을 모두 처음부터 시작할까요?')){localStorage.removeItem(KEY);state={done:[],equipped:{},selected:0,page:'home',question:null};setPage('home')}};render();
</script></body></html>
