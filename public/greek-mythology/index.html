[4,'아프로디테는 어떤 여신일까요?',['사랑과 아름다움','바다와 지진','지혜와 전략','농업'],0],[4,'아프로디테와 잘 어울리는 상징은?',['장미','번개','삼지창','망치'],0],[4,'아프로디테를 떠올리면 생각나는 것은?',['사랑','천둥','전쟁','대장간'],0],[4,'아프로디테의 상징으로 알려진 새는?',['비둘기','독수리','부엉이','까마귀'],0],[4,'아프로디테와 관련된 것은?',['사랑과 아름다움','전쟁과 승리','바다와 폭풍','농업'],0],[4,'아프로디테를 상징하는 꽃은?',['장미','해바라기','튤립','국화'],0]];
let state={q:0,score:0,streak:0,stars:[0,0,0,0,0],answered:false};const $=id=>document.getElementById(id);
function save(){localStorage.setItem('greekQuizState',JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem('greekQuizState'));if(s&&s.stars)state={...state,...s}}catch(e){}}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');if(id==='map')renderMap();if(id==='collectionScreen')renderCollection()}
function art(i,progress=6){let p=Math.max(0,Math.min(6,progress));return '<div class="charArt c'+i+' p'+p+'"></div>'}
function renderMap(){let t=state.stars.reduce((a,b)=>a+b,0);$('totalStars').textContent=t;document.querySelectorAll('.island').forEach(el=>{let i=+el.dataset.char;el.querySelector('small').textContent=state.stars[i]+'/6 ⭐'})}
function renderQuiz(){let x=qs[state.q],c=chars[x[0]],n=state.stars[x[0]];$('qportrait').innerHTML=art(x[0],n);$('qstage').textContent=(x[0]+1)+'단계 · '+c.role;$('qname').textContent=c.name;$('qstars').innerHTML=Array.from({length:6},(_,i)=>'<span class="'+(n>i?'on':'')+'">★</span>').join('');$('quizStars').textContent=state.stars.reduce((a,b)=>a+b,0);$('qnum').textContent='QUEST '+(state.q+1)+' / 30';$('qtext').textContent=x[1];$('feedback').className='feedback';$('next').className='next';$('answers').innerHTML='';x[2].forEach((a,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>answer(i,b);$('answers').appendChild(b)})}
function answer(i,b){if(state.answered)return;let x=qs[state.q],all=[...$('answers').children];if(i===x[3]){all.forEach(v=>v.disabled=true);b.classList.add('good');state.score++;state.streak++;state.stars[x[0]]=Math.min(6,state.stars[x[0]]+1);state.answered=true;save();$('feedback').textContent=state.stars[x[0]]===6?'🎉 별 6개! 캐릭터가 완성됐어요!':'⭐ 정답! 별 하나를 획득했어요!';$('feedback').className='feedback show';setTimeout(()=>showReward(x[0]),320)}else{b.classList.add('bad');state.streak=0;$('feedback').textContent='💡 다시 생각해 보세요! 힌트: '+['하늘과 번개','푸른 바다와 삼지창','지혜와 부엉이','빛과 음악','사랑과 장미'][x[0]];$('feedback').className='feedback show';save();setTimeout(()=>b.classList.remove('bad'),450)}}
function showReward(i){let n=state.stars[i];$('rewardArt').innerHTML=art(i,n);$('rewardName').textContent=chars[i].name;$('rewardBar').style.width=(n/6*100)+'%';$('rewardCount').textContent=n+' / 6 ⭐';show('rewardScreen')}
function renderCollection(){$('colStars').textContent=state.stars.reduce((a,b)=>a+b,0);$('collectionGrid').innerHTML='';chars.forEach((c,i)=>{let n=state.stars[i],d=document.createElement('div');d.className='ccard '+(n?'':'lock');d.innerHTML='<div class="pic">'+(n?art(i,n):art(i,0))+'</div><b>'+c.name+'</b><small>'+n+'/6 ⭐</small><div class="pbar"><i style="width:'+(n/6*100)+'%"></i></div>';d.onclick=()=>n===6?showStory(i):toast((6-n)+'개의 별을 더 모아보세요!');$('collectionGrid').appendChild(d)})}
function showStory(i){$('storyPic').innerHTML=art(i,6);$('storyRibbon').textContent=chars[i].role;$('storyName').textContent=chars[i].name;$('storyText').textContent=chars[i].story;show('storyScreen')}
function toast(t){let e=$('feedback');if(e){e.textContent=t;e.className='feedback show';setTimeout(()=>e.className='feedback',1500)}}
$('hero1').innerHTML=art(3,6);$('hero2').innerHTML=art(0,6);$('hero3').innerHTML=art(4,6);
$('start').onclick=()=>show('map');document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>show(b.dataset.back));$('toCollection').onclick=()=>show('collectionScreen');$('quizCollection').onclick=()=>show('collectionScreen');$('quizBack').onclick=()=>show('map');
document.querySelectorAll('.island').forEach(el=>el.onclick=()=>{state.q=qs.findIndex(x=>x[0]===+el.dataset.char);state.answered=false;show('quizScreen');renderQuiz()});
$('next').onclick=()=>{state.q=(state.q+1)%30;state.answered=false;save();show('quizScreen');renderQuiz()};$('rewardNext').onclick=()=>{state.q=(state.q+1)%30;state.answered=false;show('quizScreen');renderQuiz()};$('rewardCollection').onclick=()=>show('collectionScreen');$('storyNext').onclick=()=>show('collectionScreen');
load();renderMap();
})();
</script></body></html>
