<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7bcfff"><title>그리스로마 신화 퀴즈 어드벤처</title><style>
:root{--ink:#392b58;--muted:#766b8b;--p:#7867e8;--pink:#ef70b1;--gold:#ffc33d;--good:#5bc87a;--bad:#ed7180}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:linear-gradient(#bfeaff,#edf8ff 35%,#f8eaff 75%,#fff4dc);min-height:100vh}button{font:inherit}.wrap{max-width:760px;margin:auto;padding:12px 12px 36px}.hero{position:relative;overflow:hidden;border:3px solid #fff;border-radius:30px;padding:18px;background:linear-gradient(145deg,#4ba5f3,#8170e9 50%,#ef78bc);box-shadow:0 15px 35px #5c55a22b;color:#fff}.hero:after,.hero:before{content:"";position:absolute;background:#fff5;border-radius:50%}.hero:before{width:130px;height:45px;right:-20px;top:15px}.hero:after{width:110px;height:40px;left:-30px;bottom:-15px}.top{display:flex;justify-content:space-between;position:relative;z-index:1}.badge,.restart{border-radius:999px;padding:7px 11px;font-size:12px;font-weight:900}.badge{background:#fff3;border:1px solid #fff7}.restart{border:0;background:#fff;color:#705fd5}.hero h1{font-size:31px;line-height:1.08;margin:19px 0 7px;position:relative;z-index:1;text-shadow:0 3px #58499a66}.hero p{margin:0;line-height:1.5;font-weight:700;position:relative;z-index:1}.stats{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1}.stat{background:#fff2;border:1px solid #fff5;border-radius:15px;padding:8px 11px;min-width:85px}.stat b{display:block;font-size:18px}.stat small{font-size:11px}.tabs{display:flex;gap:8px;margin:12px 0}.tab{flex:1;border:2px solid #fff;background:#ffffffc9;border-radius:17px;padding:12px;font-weight:900;color:#796d91}.tab.active{background:#fff;color:#685bd1;border-color:#b9afff}.panel{background:#fffffff2;border:2px solid #fff;border-radius:26px;padding:14px;box-shadow:0 12px 28px #5d487018}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.stage{font-weight:1000;color:#6658d1}.meter{display:flex;gap:2px;font-size:20px}.meter span{color:#ddd5e8}.meter .on{color:#ffc33d;text-shadow:0 2px #fff}.character{display:grid;grid-template-columns:180px 1fr;gap:14px}.portrait,.mini,.completeArt{overflow:hidden;border:3px solid #fff;border-radius:24px;background:linear-gradient(#fff1aa,#e5dcff);box-shadow:inset 0 0 0 1px #dacff2}.portrait{height:205px}.art{width:100%;height:100%;display:block}.info h2{margin:2px 0 0;font-size:25px}.role{color:#7965df;font-weight:900;font-size:13px}.desc{color:var(--muted);font-size:13px;line-height:1.45;margin:8px 0}.stars{display:flex;gap:5px;margin:10px 0 3px}.stars i{font-style:normal;width:29px;height:29px;display:grid;place-items:center;border-radius:9px;background:#eee8f4;color:#cfc6da}.stars i.on{background:linear-gradient(145deg,#ffe47c,#ffb82e);color:#fff;box-shadow:0 3px 7px #f4b82c33}.label{font-size:11px;color:#8a7e99;font-weight:800}.q{border-top:1px dashed #ded3eb;margin-top:13px;padding-top:14px}.qtag{font-size:11px;font-weight:1000;color:#a06fc2}.q h3{font-size:19px;line-height:1.45;margin:5px 0 12px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.ans{min-height:58px;text-align:left;border:2px solid #e7e0f0;background:#fff;border-radius:17px;padding:11px 12px;font-weight:850;color:var(--ink);box-shadow:0 3px #e5dff0}.ans.good{border-color:var(--good);background:#ecfff2}.ans.bad{border-color:var(--bad);background:#fff0f2}.feed{display:none;margin-top:10px;border-radius:15px;padding:10px 12px;background:#f7f3ff;color:#5f5375;font-size:13px}.feed.show{display:block}.next{display:none;width:100%;margin-top:9px;border:0;border-radius:17px;padding:13px;background:linear-gradient(90deg,#6e62df,#ec67ae);color:#fff;font-weight:1000;box-shadow:0 5px #b45c9a}.next.show{display:block}.collection{display:none}.collection.show{display:block}.intro{color:var(--muted);font-size:12px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border:2px solid #eee5f5;border-radius:20px;padding:9px}.card.lock{opacity:.6;filter:saturate(.5)}.mini{height:120px}.card b{display:block;margin-top:7px}.card small{color:var(--muted);font-size:11px}.prog{height:8px;background:#eee7f2;border-radius:99px;margin-top:7px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,#ffc43b,#ed6cac)}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:#32274e;color:#fff;padding:11px 16px;border-radius:999px;opacity:0;transition:.25s;z-index:5;font-weight:900;font-size:13px;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{display:none;position:fixed;inset:0;background:#241a3dcc;z-index:10;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.modalIn{max-width:390px;width:100%;background:#fff;border:3px solid #fff;border-radius:28px;padding:13px;text-align:center}.completeArt{height:300px}.modal h2{margin:9px 0 2px;color:#6c5bd2}.modal p{margin:4px 0 10px;color:var(--muted);font-size:13px}.close{width:100%;border:0;border-radius:16px;padding:12px;background:linear-gradient(90deg,#6f61df,#ef68ad);color:#fff;font-weight:1000}@media(max-width:560px){.hero h1{font-size:27px}.character{grid-template-columns:125px 1fr}.portrait{height:170px}.info h2{font-size:21px}.answers{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.mini{height:105px}.completeArt{height:280px}}@media(max-width:360px){.character{grid-template-columns:1fr}.portrait{height:160px}.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><section class="hero"><div class="top"><span class="badge">🏛️ 올림포스 탐험대</span><button class="restart" id="reset">처음부터</button></div><h1>그리스로마<br>신화 퀴즈 어드벤처 ✨</h1><p>퀴즈를 맞힐 때마다 ⭐ 별을 모아요!<br>별 6개를 모으면 나만의 신화 캐릭터가 완성돼요.</p><div class="stats"><div class="stat"><b id="score">0</b><small>⭐ 모은 별</small></div><div class="stat"><b id="done">0/5</b><small>🏆 완성 캐릭터</small></div><div class="stat"><b id="streak">0</b><small>🔥 연속 정답</small></div></div></section><div class="tabs"><button class="tab active" id="qt">🎯 퀴즈</button><button class="tab" id="ct">📖 나의 캐릭터</button></div><section class="panel" id="quiz"><div class="bar"><span class="stage" id="stage"></span><div class="meter" id="meter"></div></div><div class="character"><div class="portrait" id="portrait"></div><div class="info"><h2 id="name"></h2><div class="role" id="role"></div><p class="desc" id="desc"></p><div class="stars" id="stars"></div><div class="label" id="label"></div></div></div><div class="q"><div class="qtag" id="count"></div><h3 id="question"></h3><div class="answers" id="answers"></div><div class="feed" id="feed"></div><button class="next" id="next">다음 퀴즈로 가기 →</button></div></section><section class="panel collection" id="collection"><div class="bar"><span class="stage">✨ 나의 신화 캐릭터</span><b id="ccount">0 / 5</b></div><p class="intro">퀴즈를 풀며 별을 모아 캐릭터를 하나씩 완성해 보세요!</p><div class="grid" id="grid"></div></section><p class="intro" style="text-align:center;margin-top:11px">초등학교 저학년용 · 신화 속 이야기를 재미있게 배우는 퀴즈</p></main><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="modalIn"><div class="completeArt" id="completeArt"></div><h2 id="modalTitle"></h2><p id="modalStory"></p><button class="close" id="close">계속 모험하기 ✨</button></div></div>
<script>
(()=>{const C=[['제우스','하늘과 천둥의 신','번개를 다루며 올림포스의 신들을 이끄는 신이에요.','#fff0a8','제우스는 하늘과 천둥을 다스리며 올림포스의 신들을 이끄는 신이에요.','⚡'],['포세이돈','바다의 신','거대한 삼지창을 들고 바다를 다스리는 신이에요.','#bceeff','포세이돈은 바다와 지진을 관장하며 삼지창이 대표적인 상징이에요.','🌊'],['아테나','지혜와 전략의 여신','지혜롭게 생각하고 용감하게 전략을 세우는 여신이에요.','#e9dcff','아테나는 지혜와 전략의 여신이며 부엉이와 올리브나무가 유명한 상징이에요.','🦉'],['아폴론','빛과 음악의 신','음악과 예언, 빛과 궁술과 관련된 신이에요.','#ffe8ad','아폴론은 음악과 예언, 빛과 궁술 등 여러 영역과 관련된 신이에요.','☀️'],['아프로디테','사랑과 아름다움의 여신','사랑과 아름다움을 상징하는 아름다운 여신이에요.','#ffd5e9','아프로디테는 사랑과 아름다움의 여신으로 장미와 비둘기 등이 상징이에요.','💗']];
const Q=[['제우스','제우스는 어떤 신으로 가장 잘 알려져 있을까요?',['바다와 파도의 신','하늘과 천둥의 신','음악과 예언의 신','사랑과 아름다움의 신'],1],['제우스','제우스를 상징하는 무기로 유명한 것은?',['삼지창','활','번개','망치'],2],['제우스','제우스가 신들을 이끄는 산으로 유명한 곳은?',['올림포스 산','아틀라스 산','에베레스트 산','후지산'],0],['제우스','제우스의 형제이면서 바다를 다스리는 신은?',['아폴론','아레스','포세이돈','헤르메스'],2],['제우스','제우스의 상징으로 자주 등장하는 새는?',['독수리','펭귄','타조','앵무새'],0],['제우스','제우스가 사용하는 대표적인 무기는?',['황금 사과','번개','삼지창','리라'],1],['포세이돈','포세이돈은 어떤 영역을 다스리는 신일까요?',['바다','숲','음악','사랑'],0],['포세이돈','포세이돈이 들고 있는 것으로 유명한 것은?',['리라','삼지창','번개','왕관'],1],['포세이돈','포세이돈과 가장 잘 어울리는 동물은?',['말','부엉이','사자','백조'],0],['포세이돈','포세이돈은 제우스와 어떤 관계일까요?',['형제','스승과 제자','아버지와 아들','친구'],0],['포세이돈','포세이돈은 바다뿐 아니라 무엇과도 관련된 신일까요?',['지진','음악','무지개','농업'],0],['포세이돈','포세이돈의 대표적인 무기는?',['삼지창','방패','활과 화살','망치'],0],['아테나','아테나는 어떤 것을 상징하는 여신일까요?',['지혜와 전략','바다와 폭풍','불과 대장간','농업과 수확'],0],['아테나','아테나를 상징하는 새로 유명한 것은?',['독수리','부엉이','공작','백조'],1],['아테나','아테나와 관련된 나무로 유명한 것은?',['사과나무','소나무','올리브나무','벚나무'],2],['아테나','아테나는 어떤 도시의 수호신으로 유명할까요?',['아테네','스파르타','로마','트로이'],0],['아테나','아테나가 전쟁에서 중요하게 여기는 것은?',['무조건 힘으로 싸우기','전략과 지혜','노래와 춤','보물 모으기'],1],['아테나','아테나의 대표적인 무기는?',['창','삼지창','번개','리라'],0],['아폴론','아폴론은 무엇과 관련된 신일까요?',['음악과 예언','바다와 지진','대장간과 불','사랑과 결혼'],0],['아폴론','아폴론이 연주하는 악기로 유명한 것은?',['리라','북','피아노','트럼펫'],0],['아폴론','아폴론과 관련된 동물로 자주 알려진 것은?',['돌고래','까마귀','호랑이','팬더'],1],['아폴론','아폴론은 어떤 활동과도 관련이 깊을까요?',['궁술','요리','항해','농사'],0],['아폴론','아폴론의 이미지에서 자주 볼 수 있는 밝은 상징은?',['달빛','태양빛','눈보라','안개'],1],['아폴론','아폴론과 쌍둥이 남매로 알려진 여신은?',['아테나','아르테미스','헤라','아프로디테'],1],['아프로디테','아프로디테는 어떤 여신일까요?',['사랑과 아름다움의 여신','바다와 지진의 여신','지혜와 전략의 여신','농업과 수확의 여신'],0],['아프로디테','아프로디테와 잘 어울리는 상징은?',['장미','번개','삼지창','망치'],0],['아프로디테','아프로디테의 이름을 들으면 가장 먼저 떠올릴 수 있는 것은?',['사랑','천둥','전쟁','대장간'],0],['아프로디테','아프로디테의 상징으로 알려진 새는?',['비둘기','독수리','부엉이','까마귀'],0],['아프로디테','아프로디테는 어떤 아름다움과 관련이 있을까요?',['사랑과 아름다움','전쟁과 승리','바다와 폭풍','농업과 수확'],0],['아프로디테','아프로디테를 상징하는 꽃은?',['장미','해바라기','튤립','국화'],0]].map(x=>({c:C.findIndex(v=>v[0]===x[0]),q:x[1],a:x[2],k:x[3]}));
const S0={index:0,score:0,streak:0,stars:[0,0,0,0,0],answered:false};let S={...S0};const $=id=>document.getElementById(id);
function art(i){let c=C[i],hair=['#f2c45f','#55aee8','#6d61c8','#f0b94f','#f08db8'][i],body=['#fff','#287ec9','#8d7be2','#fffdf2','#fff'][i],acc=['⚡','🔱','🛡️','☀️','🌹'][i];return '<svg class="art" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg"><rect width="220" height="220" fill="'+c[3]+'"/><circle cx="110" cy="83" r="47" fill="#ffd5b4"/><path d="M61 82Q67 25 110 38Q153 25 160 82Q137 60 110 66Q83 60 61 82" fill="'+hair+'"/><circle cx="94" cy="86" r="4" fill="#392b58"/><circle cx="142" cy="86" r="4" fill="#392b58"/><path d="M99 104q11 8 22 0" fill="none" stroke="#d66b73" stroke-width="4" stroke-linecap="round"/><path d="M77 126Q110 112 143 126L165 207H55Z" fill="'+body+'"/><circle cx="33" cy="43" r="13" fill="#fff8"/><text x="33" y="49" text-anchor="middle" font-size="18">'+acc+'</text><path d="M45 175q18-18 32 0M175 175q-18-18-32 0" fill="none" stroke="#fff" stroke-width="5" opacity=".8"/><text x="110" y="205" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">'+c[0]+' ✦</text></svg>'}
function save(){localStorage.setItem('greekQuizState',JSON.stringify(S))}function load(){try{let x=JSON.parse(localStorage.getItem('greekQuizState'));if(x&&Array.isArray(x.stars))S={...S0,...x}}catch(e){}}
function render(){let q=Q[S.index],c=C[q.c],n=S.stars[q.c];$('stage').textContent=(q.c+1)+'단계 · '+c[0];$('count').textContent='QUEST '+(S.index+1)+' / 30';$('name').textContent=c[0];$('role').textContent=c[1];$('desc').textContent=c[2];$('portrait').innerHTML=art(q.c);$('score').textContent=S.score;$('done').textContent=S.stars.filter(x=>x===6).length+'/5';$('streak').textContent=S.streak;$('meter').innerHTML=Array.from({length:6},(_,i)=>'<span class="'+(n>i?'on':'')+'">★</span>').join('');$('stars').innerHTML=Array.from({length:6},(_,i)=>'<i class="'+(n>i?'on':'')+'">★</i>').join('');$('label').textContent=n+'/6 별 · '+(n===6?'캐릭터 완성! 🎉':'별을 더 모아 캐릭터를 완성해 보세요');$('question').textContent=q.q;$('feed').className='feed';$('next').className='next';$('answers').innerHTML='';q.a.forEach((a,i)=>{let b=document.createElement('button');b.className='ans';b.textContent=a;b.onclick=()=>answer(i,b);$('answers').appendChild(b)});renderCollection()}
function answer(i,b){if(S.answered)return;let q=Q[S.index],all=[...$('answers').children];if(i===q.k){all.forEach(x=>x.disabled=true);b.classList.add('good');S.score++;S.streak++;S.stars[q.c]=Math.min(6,S.stars[q.c]+1);S.answered=true;$('feed').textContent=S.stars[q.c]===6?'🎉 별 6개 완성! 나만의 캐릭터가 완성됐어요!':'⭐ 정답! 별 하나를 얻었어요!';$('feed').className='feed show';$('next').className='next show';save();if(S.stars[q.c]===6)show(q.c)}else{b.classList.add('bad');S.streak=0;$('feed').textContent='💡 힌트: '+['올림포스의 하늘과 번개를 떠올려 보세요.','푸른 바다와 삼지창을 떠올려 보세요.','지혜와 전략, 부엉이를 떠올려 보세요.','음악과 빛, 리라를 떠올려 보세요.','사랑과 아름다움, 장미를 떠올려 보세요.'][q.c];$('feed').className='feed show';save();setTimeout(()=>{b.classList.remove('bad')},450)}}
function renderCollection(){$('ccount').textContent=S.stars.filter(x=>x===6).length+' / 5';$('grid').innerHTML='';C.forEach((c,i)=>{let n=S.stars[i],d=document.createElement('div');d.className='card '+(n===6?'':'lock');d.innerHTML='<div class="mini">'+(n?art(i):'<div style="display:grid;place-items:center;height:100%;font-size:48px">❔</div>')+'</div><b>'+c[0]+'</b><small>'+c[1]+'</small><div class="prog"><i style="width:'+n/6*100+'%"></i></div><small>'+n+'/6 별 '+(n===6?' · 완성! 🎉':'')+'</small>';d.onclick=()=>n===6?show(i):toast((6-n)+'개의 별을 더 모으면 '+c[0]+'이 완성돼요!');$('grid').appendChild(d)})}
function show(i){$('completeArt').innerHTML=art(i);$('modalTitle').textContent=C[i][0]+' 완성! ✨';$('modalStory').textContent=C[i][4];$('modal').classList.add('show')}function toast(t){let e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.t);window.t=setTimeout(()=>e.classList.remove('show'),1800)}
$('next').onclick=()=>{S.index=(S.index+1)%30;S.answered=false;save();render()};$('qt').onclick=()=>{$('qt').classList.add('active');$('ct').classList.remove('active');$('quiz').style.display='block';$('collection').classList.remove('show')};$('ct').onclick=()=>{$('ct').classList.add('active');$('qt').classList.remove('active');$('quiz').style.display='none';$('collection').classList.add('show');renderCollection()};$('close').onclick=()=>$('modal').classList.remove('show');$('reset').onclick=()=>{if(confirm('처음부터 다시 시작할까요? 모은 별이 모두 사라져요.')){S={...S0};save();render();toast('새로운 신화 모험을 시작해요! ✨')}};load();render()})();
</script></body></html>
